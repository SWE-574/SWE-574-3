name: CI — Frontend

on:
  push:
    branches: [dev, "feature/**", "fix/**", "chore/**"]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    branches: [dev]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: node-

      # Stale tarball-extraction tmp files in ~/.npm/_cacache/tmp can cause
      # `npm ci` to crash with `EEXIST: file already exists`. Wiping the
      # tmp dir is safe and only adds a few ms.
      - name: Clear npm cache tmp
        run: rm -rf ~/.npm/_cacache/tmp

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test -- --run --coverage

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Type-check & build
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build
