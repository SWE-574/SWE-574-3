name: CI — Mobile

on:
  push:
    branches: [dev, "feature/**", "fix/**", "chore/**"]
    paths:
      - "mobile-client/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    branches: [dev]
    paths:
      - "mobile-client/**"
      - ".github/workflows/ci-mobile.yml"

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: mobile-client/node_modules
          key: mobile-node-${{ hashFiles('mobile-client/package-lock.json') }}
          restore-keys: mobile-node-

      # Stale tarball-extraction tmp files in ~/.npm/_cacache/tmp can cause
      # `npm ci` to crash with `EEXIST: file already exists`. Wiping the
      # tmp dir is safe and only adds a few ms.
      - name: Clear npm cache tmp
        run: rm -rf ~/.npm/_cacache/tmp

      - name: Install dependencies
        working-directory: mobile-client
        run: npm ci --prefer-offline --no-audit

      - name: Audit dependencies
        working-directory: mobile-client
        run: npm audit --audit-level=high

      - name: TypeScript type check
        working-directory: mobile-client
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: mobile-client
        run: npm test -- --ci --forceExit --coverage

  build:
    name: EAS Preview Build (Android)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.ENABLE_MOBILE_BUILD == 'true' && github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: mobile-client/node_modules
          key: mobile-node-${{ hashFiles('mobile-client/package-lock.json') }}
          restore-keys: mobile-node-

      - name: Clear npm cache tmp
        run: rm -rf ~/.npm/_cacache/tmp

      - name: Install dependencies
        working-directory: mobile-client
        run: npm ci --prefer-offline --no-audit

      - name: EAS preview build (Android)
        working-directory: mobile-client
        run: eas build --profile preview --platform android --non-interactive
