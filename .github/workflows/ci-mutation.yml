name: CI — Mutation testing

on:
  pull_request:
    branches: [dev]
    paths:
      - "backend/api/ranking.py"
      - "backend/api/achievement_utils.py"
      - "backend/api/badge_utils.py"
      - "backend/api/event_permissions.py"
      - "backend/api/services.py"
      - "backend/api/search_filters.py"
      - "frontend/src/services/api.ts"
      - "frontend/src/services/conversationAPI.ts"
      - "frontend/src/utils/dateTime.ts"
      - "frontend/src/utils/eventUtils.ts"
      - "frontend/src/utils/cookies.ts"
      - "backend/pyproject.toml"
      - "frontend/stryker.conf.json"
      - ".github/workflows/ci-mutation.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: the_hive_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DB_NAME: the_hive_db
      DB_USER: postgres
      DB_PASSWORD: postgres_ci
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: hive-media
      MINIO_USE_SSL: "false"
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SETTINGS_MODULE: hive_project.settings

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDAL / GEOS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Migrate
        working-directory: backend
        run: .venv/bin/python manage.py migrate --no-input

      - name: Run mutmut
        working-directory: backend
        run: |
          .venv/bin/mutmut run || true
          .venv/bin/mutmut results > mutmut-results.txt
          .venv/bin/mutmut html || true

      - name: Upload mutmut report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mutation
          path: |
            backend/mutmut-results.txt
            backend/html/

      - name: Comment mutation summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('backend/mutmut-results.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Backend mutation testing (mutmut)\n\n```\n' + summary + '\n```',
            });

  frontend-stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Run Stryker
        working-directory: frontend
        run: npx stryker run --reporters json,clear-text || true

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-mutation
          path: |
            frontend/reports/
            frontend/tests/reports/mutation/

      - name: Comment Stryker score on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'frontend/reports/mutation/mutation.json';
            if (!fs.existsSync(path)) {
              core.warning('No Stryker report produced.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const score = report && report.mutationScore != null ? report.mutationScore : 'unknown';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Frontend mutation testing (Stryker)\n\nMutation score: **' + score + '**',
            });
