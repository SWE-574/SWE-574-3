[pytest]
# CI runs the suite as a matrix: one job marks `-m unit`, the other
# `-m integration`. Each branch only exercises its half of the codebase,
# so the inline `--cov-fail-under=70` gate (still on in pytest.ini for
# full local runs) cannot be satisfied here. Coverage is instead gated
# by the Codecov status check wired in ci-backend.yml.
DJANGO_SETTINGS_MODULE = hive_project.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = api/tests
addopts =
    --strict-markers
    --strict-config
    --tb=short
    --cov=api
    --cov-branch
    --cov-report=html:tests/reports/coverage/html
    --cov-report=term-missing
    --cov-report=json:tests/reports/coverage/coverage.json
    --cov-report=xml:tests/reports/coverage/coverage.xml
    --junit-xml=tests/reports/junit.xml
    --maxfail=10
    --timeout=90
    -n auto
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_db: Tests that require database
    requires_redis: Tests that require Redis
    e2e: End-to-end tests
    websocket: Tests that exercise Channels consumers
asyncio_mode = auto
