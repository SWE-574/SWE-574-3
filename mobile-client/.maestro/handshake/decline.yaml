appId: com.apiary.thehive
tags:
  - handshake
env:
  TEST_EMAIL: cem@demo.com
  TEST_PASSWORD: demo123
---
- runFlow: ../auth/login.yaml
- tapOn:
    text: "Messages(, tab,.*)?"
- tapOn:
    text: "Maestro test handshake request"
    optional: true
- tapOn:
    text: "Decline"
- extendedWaitUntil:
    visible:
      text: "(?i)declined"
    timeout: 10000
