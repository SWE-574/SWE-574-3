appId: com.apiary.thehive
tags:
  - handshake
  - qr
env:
  # Participant joins the event via manual code entry — the camera-less
  # fallback used when the camera permission is denied or the device lacks a
  # camera. Pass a real QR token in with
  # `maestro test -e QR_CODE=<token>` before running.
  TEST_EMAIL: cem@demo.com
  TEST_PASSWORD: demo123
  # Real event title from the demo seed.
  EVENT_TITLE: Neighborhood Potluck Dinner Under the Stars
  QR_CODE: PASTE_A_VALID_TOKEN_HERE
---
- runFlow: ../auth/login.yaml
- tapOn:
    text: "Home(, tab,.*)?"
- waitForAnimationToEnd:
    timeout: 4000
# Tap by literal event title — Maestro doesn't interpolate ${VAR} inside
# matcher objects.
- tapOn:
    text: "Neighborhood Potluck Dinner Under the Stars"
- tapOn:
    text: "Check in"
- tapOn:
    text: "Enter code manually"
- tapOn: "Code"
- inputText: ${QR_CODE}
- hideKeyboard
- tapOn:
    text: "Submit"
- extendedWaitUntil:
    visible:
      text: "(?i)checked in"
    timeout: 10000
