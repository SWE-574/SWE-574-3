appId: com.apiary.thehive
tags:
  - handshake
  - qr
env:
  # Logs in as the event organizer, opens an event detail, and triggers the
  # QR attendance modal. Asserts the QR token / manual code area is visible.
  TEST_EMAIL: organizer@demo.com
  TEST_PASSWORD: demo123
  EVENT_TITLE: Demo Yoga Session
---
- runFlow: ../auth/login.yaml
- tapOn:
    text: "Home"
- tapOn:
    text: ${EVENT_TITLE}
- tapOn:
    text: "Attendance"
- assertVisible:
    text: "Show this to participants"
    timeout: 8000
# QR is rendered as an SVG — Maestro can't read its contents, but the modal
# also exposes a manual code that we can assert is non-empty.
- assertVisible:
    id: "qr-manual-code"
    optional: true
