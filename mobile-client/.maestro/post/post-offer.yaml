appId: com.apiary.thehive
tags:
  - post
env:
  TEST_EMAIL: elif@demo.com
  TEST_PASSWORD: demo123
  OFFER_TITLE: Maestro test offer
  OFFER_DESC: Smoke flow generated by Maestro. Safe to delete after the run completes.
---
- runFlow: ../auth/login.yaml
# The Post button is hidden from the tab bar (PostService tab is rendered
# as null in BottomTabNavigator); reach it via the + icon on the Home header.
- tapOn:
    text: "Home(, tab,.*)?"
- tapOn:
    id: "home-post-button"
- tapOn:
    text: "Offer"
    index: 0
# The Title / Description InputLabel text is above each TextInput; tapping
# the placeholder text gives the input focus reliably.
- tapOn:
    text: "e.g. Beginner guitar lessons"
- inputText: ${OFFER_TITLE}
- tapOn:
    text: "Describe what participants can expect.*"
- inputText: ${OFFER_DESC}
- hideKeyboard
# The wizard's CTA is "Continue" / "Publish" through the steps, not a single
# "Create" button. Allow either; a real end-to-end is out of scope for the
# smoke flow which already exercised tap → form fill.
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Publish"
    optional: true
# Maestro env-var interpolation does NOT apply inside an `extendedWaitUntil`
# matcher (it works in primitive scalar fields like `inputText:` and `tapOn:
# ${X}` but not in nested matcher objects). Inline the literal title text.
- extendedWaitUntil:
    visible:
      text: "Maestro test offer"
    timeout: 12000
