appId: com.apiary.thehive
tags:
  - post
env:
  TEST_EMAIL: elif@demo.com
  TEST_PASSWORD: demo123
  OFFER_TITLE: Maestro test offer ${RANDOM}
  OFFER_DESC: Smoke flow generated by Maestro. Safe to delete.
---
- runFlow: ../auth/login.yaml
- tapOn:
    text: "Post"
    index: 0
- tapOn:
    text: "Offer"
- tapOn: "Title"
- inputText: ${OFFER_TITLE}
- tapOn: "Description"
- inputText: ${OFFER_DESC}
- hideKeyboard
# Default location_type / hours / category should be fine for a smoke test.
- tapOn:
    text: "Create"
- assertVisible:
    text: ${OFFER_TITLE}
    timeout: 12000
